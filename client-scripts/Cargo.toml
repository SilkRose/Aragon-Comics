[package]
name = "aragon-comics-client-scripts"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-worker = { version = "0.6.0", features = ["futures"] }
js-sys = "0.3.105"
oxipng = { version = "10.2.1", default-features = false, features = ["freestanding", "zopfli"] }
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3.105", features = ["DedicatedWorkerGlobalScope"] }
